name: Fetch art
# art/sources.tsv 의 공개 도메인 명화를 내려받아 art/raw/ 에 올린다 (이 환경에서는 그림 사이트에 직접 닿지 않아 Actions 로)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["art/sources.tsv", "art/search.tsv", ".github/workflows/fetch-art.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p art/raw
          UA="LookCloser/0.1 (https://github.com/graviton94/LOOKCLOSER)"
          grep -v '^#' art/sources.tsv | while IFS=$'\t' read -r name file; do
            [ -z "$name" ] && continue
            out="art/raw/$name.jpg"; [ -s "$out" ] && continue
            for w in 4000 3840 2560; do
              curl -sfL -A "$UA" -o "$out" "https://commons.wikimedia.org/wiki/Special:FilePath/$file?width=$w" && break
              sleep 3
            done
            ls -la "$out"; file "$out"
          done
      - name: Search and download
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          UA={"User-Agent":"LookCloser/0.1 (https://github.com/graviton94/LOOKCLOSER)"}
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=60))
          os.makedirs("art/raw",exist_ok=True)
          man=open("art/raw/manifest.tsv","a")
          for line in open("art/search.tsv"):
              if line.startswith("#") or not line.strip(): continue
              key,q=line.rstrip("\n").split("\t")
              out=f"art/raw/{key}.jpg"
              if os.path.exists(out): continue
              r=get("https://commons.wikimedia.org/w/api.php?"+urllib.parse.urlencode({"action":"query","format":"json","generator":"search","gsrnamespace":6,"gsrsearch":q,"gsrlimit":5,"prop":"imageinfo","iiprop":"url|extmetadata|mime","iiurlwidth":1600}))
              pages=sorted(r.get("query",{}).get("pages",{}).values(),key=lambda p:p.get("index",99))
              pages=[p for p in pages if p.get("imageinfo") and p["imageinfo"][0].get("mime")=="image/jpeg"]
              if not pages: print("none",key); continue
              ii=pages[0]["imageinfo"][0]; md=ii.get("extmetadata",{})
              urllib.request.urlretrieve if False else None
              data=urllib.request.urlopen(urllib.request.Request(ii["thumburl"],headers=UA),timeout=120).read()
              open(out,"wb").write(data)
              lic=md.get("LicenseShortName",{}).get("value",""); art=md.get("Artist",{}).get("value","")
              man.write("\t".join([key,pages[0]["title"],lic,art.replace("\t"," ").replace("\n"," ")[:200],ii["descriptionurl"]])+"\n")
              print(key,pages[0]["title"],lic); time.sleep(2)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/raw && (git diff --cached --quiet || (git commit -m "Art: fetch originals" && git push))
