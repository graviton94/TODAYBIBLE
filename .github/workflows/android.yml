name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "design/**", "data/**", "scripts/generate.py", "scripts/build_fonts.py", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generated files and fonts are up to date
        run: |
          python3 scripts/generate.py --check
          pip install -q fonttools
          python3 scripts/build_fonts.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :core:test :app:assembleDebug 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        working-directory: android
        # 로그를 못 여는 곳에서도 보이게: 오류를 주석(annotation)으로 (한 줄에 여러 개를 묶어 10개 제한 안에)
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -120 || true
          grep -iE "^e: |What went wrong|error:|ERROR|FAILED|Exception|Caused by" -A2 build.log | grep -v "^--$" | sed 's#.*/src/main/java/io/github/graviton94/todaybible/##' | head -100 \
            | awk '{ printf "%s%%0A", $0 } NR % 10 == 0 { print "" }' | while read -r chunk; do echo "::error::$chunk"; done
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/TodayBible-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TodayBible-apk
          path: out/*.apk
