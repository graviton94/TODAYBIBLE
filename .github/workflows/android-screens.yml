name: Android screenshots

# 에뮬레이터에서 디버그 APK 를 실행해 장면별 화면을 캡처하고 screenshots-android 브랜치에 올린다.
# 필요할 때만 돈다: 커밋 메시지에 [shots] 가 있을 때, 또는 직접 실행.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "찍을 장면 (예: q01|p05). 비우면 전부"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["android/**", "design/**", "scripts/android_shots.sh", ".github/workflows/android-screens.yml"]

concurrency:
  group: android-screens
  cancel-in-progress: false

permissions:
  contents: write

env:
  NARRATION_URL: ${{ vars.CF_R2_PUBLIC_URL }}
jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Pick scenes
        # 커밋 말에 [shots:q01|p05] 처럼 쓰면 그 장면만 (빠름). [shots] 는 전부.
        env:
          MSG: ${{ github.event.head_commit.message }}
          PICK: ${{ github.event.inputs.only }}
        # 마지막 [shots:…] 를 써요 (설명 속 예시와 헷갈리지 않게)
        run: echo "ONLY=${PICK:-$(printf '%s' "$MSG" | grep -oP '\[shots:\K[^\]]+' | tail -1)}" >> "$GITHUB_ENV"
      # [shots:rel] (또는 rel 이 든 목록): R8 로 줄인 release APK 를 monkey 로 눌러 보는 시험도
      - name: Build release APK (R8 smoke)
        if: contains(env.ONLY, 'rel')
        working-directory: android
        run: ./gradlew :app:assembleRelease
      # 에뮬레이터 상태를 캐시해 두고 다음부터는 이어서 켜요 (부팅 몇 분 → 수십 초)
      - name: AVD cache
        uses: actions/cache@v4
        id: avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-pixel_6-v1
      - name: Create AVD snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          cores: 2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "snapshot ready"
      - name: Run on emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          force-avd-creation: false
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          cores: 2
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # 장면 하나가 멈춰도 잡이 통째로 취소되지 않게: 시간 제한 뒤 찍은 것 + 로그를 그대로 올려요
          script: adb install -r android/app/build/outputs/apk/debug/app-debug.apk && (ONLY="$ONLY" WARM="${ONLY:+5}" timeout 36m bash scripts/android_shots.sh shots || echo "capture stopped early" > shots/STOPPED.txt); mkdir -p shots; [ -f android/app/build/outputs/apk/release/app-release.apk ] && timeout 8m bash scripts/release_smoke.sh shots; adb logcat -d | tail -n 4000 > shots/logcat_tail.txt; true
      - name: Push to screenshots-android branch
        if: always()
        run: |
          mkdir -p shots && cd shots
          git init -q -b screenshots-android
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "source: ${GITHUB_SHA}" > SOURCE.txt
          git add -A && git commit -qm "android screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-android
