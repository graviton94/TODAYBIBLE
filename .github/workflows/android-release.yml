name: Android release (Play)

# Play 에 올릴 AAB. 올리기 키: 저장소의 잠긴 키 (android/keystore/upload.jks.gpg, ‘Android signing key’ 워크플로가 만듦) 를
# Secrets 의 ANDROID_UPLOAD_PASSPHRASE 로 풀어 씀 (키스토어 · 키 암호도 같고 별칭은 upload). carpediem 과 같은 방식.
# 결과: 이 실행의 Artifacts 에 app-release.aab (Play Console › 내부 테스트 › 새 버전에 올리기)
on:
  workflow_dispatch:
    inputs:
      version: { description: "version name (e.g. 1.0.0)", default: "1.0.0" }

permissions: { contents: read }

env:
  NARRATION_URL: ${{ vars.CF_R2_PUBLIC_URL }}
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unlock the upload key
        env: { P: "${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}" }
        run: |
          if [ -z "$P" ] || [ ! -f android/keystore/upload.jks.gpg ]; then echo "::error::올리기 키가 없어요 (Secrets 의 ANDROID_UPLOAD_PASSPHRASE 와 ‘Android signing key’ 실행)"; exit 1; fi
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 -d -o "$RUNNER_TEMP/upload.jks" android/keystore/upload.jks.gpg 3<<<"$P"
          echo "PLAY_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build AAB
        working-directory: android
        env:
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
          PLAY_KEY_ALIAS: upload
          PLAY_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
          TB_VERSION_NAME: ${{ inputs.version }}
          # Play 판 번호는 계속 커져야 해서 시험 APK 와 겹치지 않게 1000 부터
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          export GITHUB_RUN_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          # 실패하면 마지막 줄들을 실행 화면 (annotation) 에 남겨요: 기록 파일은 밖에서 못 읽어서
          set -o pipefail
          ./gradlew :core:test :app:bundleRelease 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            grep -E "^e: |[Ee]rror:|ERROR|What went wrong|Missing class|\.(kt|xml|kts):[0-9]+" "$RUNNER_TEMP/build.log" | tail -n 40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=build::/'
            exit 1; }
          # 올리기 키로 서명됐는지 (시험 키가 아닌지) 확인
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -q "CN=sideload" && { echo "::error::signed with the sideload key"; exit 1; } || true
      - name: Forget the unlocked key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ inputs.version }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
