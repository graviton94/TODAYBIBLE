name: Narration probe
# 에뮬레이터에서 낭독 음원을 실제로 받는지: 듣기를 켜고 로그 · 받은 파일을 narration-probe 가지에.
on: workflow_dispatch
permissions: { contents: write }
env:
  NARRATION_URL: ${{ vars.CF_R2_PUBLIC_URL }}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug
        working-directory: android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p out
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            sleep 20
            adb logcat -c
            adb shell am start -W -n io.github.graviton94.todaybible/.MainActivity --ez tb.coach false --es tb.listen 19:23 --ez tb.listenPlay true
            sleep 30
            adb shell am start -W -n io.github.graviton94.todaybible/.MainActivity --ez tb.coach false --es tb.tr KJV --es tb.listen 43:3 --ez tb.listenPlay true
            sleep 30
            adb logcat -d -s Narration:* AndroidRuntime:E TextToSpeech:* > out/logcat.txt || true
            adb shell run-as io.github.graviton94.todaybible ls -laR files/narration > out/files.txt 2>&1 || true
            adb shell run-as io.github.graviton94.todaybible cat shared_prefs/today.xml > out/prefs.txt 2>&1 || true
      - name: Publish
        if: always()
        run: |
          mkdir -p out && cd out && git init -q && git checkout -q -b narration-probe && git add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm probe --allow-empty
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" narration-probe
