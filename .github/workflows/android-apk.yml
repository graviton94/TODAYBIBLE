name: Android APK

# 내 폰에 직접 설치할 APK (release 빌드 · 개발자 도구 꺼짐). 직접 실행할 때만.
# 결과: Releases 의 'android-latest' (휴대폰에서 APK 를 눌러 받아 설치)
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NARRATION_URL: ${{ vars.CF_R2_PUBLIC_URL }}
  # 교인 시험판 (APK 1주 → Play 비공개 테스트)
  TB_VERSION_NAME: "0.9.0"
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: android
        run: ./gradlew :core:test :app:assembleRelease
      - name: Publish to android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/HaruBible-${{ github.run_number }}.apk"
          # 카카오톡처럼 APK 를 막는 곳에 보낼 zip (이름이 늘 같아서 링크 하나로 최신본)
          (cd out && zip -q HaruBible.zip "HaruBible-${{ github.run_number }}.apk")
          notes="폰에서 아래 APK 를 눌러 받아 설치하세요. 처음 한 번은 '출처를 알 수 없는 앱' 허용이 필요해요. 카카오톡으로 보낼 땐 HaruBible.zip (풀면 APK). (커밋 ${GITHUB_SHA::7})"
          title="하루의 성경 시험 빌드 #${{ github.run_number }}"
          # 음성 거울 올리기와 겹치면 API 가 잠깐 막혀요: 쉬었다가 다시 (최대 5번).
          for i in 1 2 3 4 5; do
            if gh release view android-latest >/dev/null 2>&1; then
              old=$(gh release view android-latest --json assets --jq '.assets[].name' | grep -v -e "HaruBible-${{ github.run_number }}.apk" -e "^HaruBible.zip$" || true)
              gh release upload android-latest out/*.apk out/HaruBible.zip --clobber \
                && gh release edit android-latest --title "$title" --notes "$notes" --target "${GITHUB_SHA}" --prerelease \
                && { for a in $old; do gh release delete-asset android-latest "$a" --yes || true; done; exit 0; }
            else
              gh release create android-latest out/*.apk out/HaruBible.zip --prerelease --target "${GITHUB_SHA}" --title "$title" --notes "$notes" && exit 0
            fi
            echo "retry $i"; sleep $((i * 30))
          done
          exit 1
