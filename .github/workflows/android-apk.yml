name: Android APK

# 내 폰에 직접 설치할 APK (release 빌드 · 개발자 도구 꺼짐). 직접 실행할 때만.
# 결과: Releases 의 'android-latest' (휴대폰에서 APK 를 눌러 받아 설치)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: android
        run: ./gradlew :core:test :app:assembleRelease
      - name: Publish to android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/HaruBible-${{ github.run_number }}.apk"
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/*.apk --prerelease --target "${GITHUB_SHA}" \
            --title "하루의 성경 시험 빌드 #${{ github.run_number }}" \
            --notes "폰에서 아래 APK 를 눌러 받아 설치하세요. 처음 한 번은 '출처를 알 수 없는 앱' 허용이 필요해요. (커밋 ${GITHUB_SHA::7})"
