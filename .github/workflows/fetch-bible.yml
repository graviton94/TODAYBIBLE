name: Fetch Bible text
# CrossWire 모듈에서 개역한글 · KJV 본문을 받아 data/bible/ 에 올린다 (scripts/fetch_bible.py)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_bible.py", ".github/workflows/fetch-bible.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pysword==0.2.8
      - run: python3 scripts/fetch_bible.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bible && (git diff --cached --quiet || (git commit -m "Bible text: refresh from CrossWire" && git push))
