name: Fetch plates
# data/plates_source.tsv 의 도레 판화를 위키미디어 공용에서 받아 흑백 · 긴 변 900px 로 앱에 넣는다 (assets/plates/)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/plates_source.tsv", ".github/workflows/fetch-plates.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import io, os, time, urllib.parse, urllib.request
          from PIL import Image, ImageOps
          UA={"User-Agent":"HaruBible/0.1 (https://github.com/graviton94/TODAYBIBLE)"}
          out="android/app/src/main/assets/plates"; bad=[]
          for line in open("data/plates_source.tsv", encoding="utf-8"):
              if line.startswith("#") or not line.strip(): continue
              p=line.rstrip("\n").split("\t"); pid, f = p[0], p[1]
              dst=f"{out}/{pid}.jpg"
              if os.path.exists(dst): continue
              url="https://commons.wikimedia.org/wiki/Special:FilePath/"+urllib.parse.quote(f)+"?width=1200"
              data=None
              for a in range(4):
                  try: data=urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=90).read(); break
                  except Exception as e: print(pid, e); time.sleep(6*(a+1))
              if not data: bad.append(pid); continue
              im=Image.open(io.BytesIO(data)); im=ImageOps.exif_transpose(im).convert("L")
              im.thumbnail((820,820), Image.LANCZOS)
              im.save(dst, "JPEG", quality=74, optimize=True, progressive=True)
              print(pid, im.size, os.path.getsize(dst)); time.sleep(1.5)
          if bad: print("::warning::missing "+" ".join(bad))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/assets/plates && git commit -m "Plates: Doré engravings" || { echo "nothing new"; exit 0; }
          git pull --rebase origin main && git push
