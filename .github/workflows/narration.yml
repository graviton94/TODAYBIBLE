name: Narration
on:
  workflow_dispatch:
    inputs:
      voice: { description: "M5 or F5", default: "M5" }
      only: { description: "one job as book:from:to:part (empty = by books)", default: "" }
      books: { description: "books to narrate, e.g. 19,41 (empty = whole Bible)", default: "" }
      tag: { description: "release tag", default: "narration-v1" }
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs: { jobs: "${{ steps.p.outputs.jobs }}" }
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          if [ -n "${{ inputs.only }}" ]; then IFS=: read b f t p <<< "${{ inputs.only }}"
            echo "jobs=[{\"voice\":\"${{ inputs.voice }}\",\"book\":$b,\"from\":$f,\"to\":$t,\"part\":$p}]" >> $GITHUB_OUTPUT
          else python3 - <<'PY' >> $GITHUB_OUTPUT
          import json, subprocess, sys, os
          out = subprocess.run([sys.executable, "-c", "exec(open('scripts/narrate.py').read().split('import numpy')[0].replace('sys.argv[1] == \"--plan\"','True'))"], capture_output=True, text=True).stdout
          books = {int(b) for b in os.environ.get("BOOKS", "").split(",") if b.strip()}
          j = [x for x in json.loads(out) if x["voice"] == os.environ["V"] and (not books or x["book"] in books)]
          print("jobs=" + json.dumps(j))
          PY
          fi
        env: { V: "${{ inputs.voice }}", BOOKS: "${{ inputs.books }}" }
      - run: gh release view "${{ inputs.tag }}" -R "${{ github.repository }}" >/dev/null 2>&1 || gh release create "${{ inputs.tag }}" -R "${{ github.repository }}" --title "낭독 음원 ${{ inputs.tag }}" --notes "Supertonic 3 (Supertone, OpenRAIL-M)로 만든 개역한글 낭독. 권 · 장 묶음 · 목소리마다 zip 하나 (m5_19_1.zip …)."
        env: { GH_TOKEN: "${{ github.token }}" }
  part:
    needs: plan
    runs-on: ubuntu-latest
    permissions: { contents: write }
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: { job: "${{ fromJson(needs.plan.outputs.jobs) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: /tmp/st/assets, key: supertonic3-aafc6e3 }
      - name: Get Supertonic 3
        run: |
          git clone -q --depth 1 https://github.com/supertone-oss-archive/supertonic.git /tmp/st-src
          mkdir -p /tmp/st && cp -r /tmp/st-src/py /tmp/st/
          pip install -q huggingface_hub -r /tmp/st/py/requirements.txt
          [ -f /tmp/st/assets/voice_styles/M5.json ] || hf download supertone-oss-archive/supertonic-3 --revision aafc6e32416a594460b32413efc49d7fe4ce6d46 --local-dir /tmp/st/assets
          sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Narrate
        run: python scripts/narrate.py /tmp/st/py /tmp/st/assets ${{ matrix.job.voice }} ${{ matrix.job.book }} ${{ matrix.job.from }} ${{ matrix.job.to }} ${{ matrix.job.part }} out
      - name: Upload to release (one zip per chapter)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v=$(echo ${{ matrix.job.voice }} | tr A-Z a-z); b=$(printf "%02d" ${{ matrix.job.book }})
          src=out/${v}_${b}_${{ matrix.job.part }}
          for ch in $(ls $src | sed 's/_.*//' | sort -un); do
            n=$(printf "%s_%s_c%03d" $v $b $ch); (cd $src && zip -q -0 ../$n.zip ${ch}_*.m4a)
          done
          ls out/*.zip | wc -l
          gh release upload "${{ inputs.tag }}" out/*.zip --clobber -R "${{ github.repository }}"
